# MySQL 配置
[mysql]
host = 127.0.0.1
port = 3306
user = root
password = ***********
database = management_qa
table = management_faq

# Redis 配置
[redis]
host = 127.0.0.1
port = 6379
password = ***********
db = 0
# 缓存过期时间，秒
ttl = 180

# 日志配置
[log]
# 日志文件目录 相对于项目根路径的位置
log_dir = logs
# 日志级别对应数字
# DEBUG=10 INFO=20 WARNING=30 ERROR=40 CRITICAL=50
# 日志控制台级别
log_console_level = 20
# 日志文件级别
log_file_level = 20

# Milvus 配置
[milvus]
host = 127.0.0.1
port = 19530
database_name = management_qa
collection_name = management_qa

[data]
# 知识库文档根目录（main.py会自动拼接 {source}_data 子目录）
data_dir = rag_qa/data

# 模型配置
[model]
# 云上llm模型名称
dashscope_model = qwen3.7-max
# 阿里云Dashscope API密钥
dashscope_api_key = ***********
# 阿里云Dashscope基础URL
dashscope_base_url = https://dashscope.aliyuncs.com/compatible-mode/v1
# 本地向量模型在项目路径中的相对路径
embedding_path = rag_qa/models/bge-m3
# 本地重排序模型在项目路径中的相对路径
rerank_path = rag_qa/models/bge-reranker-large

# 检索参数配置
[retrieval]
# 父块大小
parent_chunk_size = 1200
# 子块大小
child_chunk_size = 300
# 块重叠大小
chunk_overlap = 50
# 粗排返回数量（混合检索Top-K）
retrieval_k = 6
# 精排候选数量（Reranker Top-M）
candidate_m = 3
# BM25 FAQ匹配阈值（0.75为宽松匹配，覆盖更多口语化问法）
bm25_threshold = 0.75
# 稠密向量权重（WeightedRanker）
dense_weight = 1.0
# 稀疏向量权重（WeightedRanker）
sparse_weight = 0.7
# 稀疏向量建索引时丢弃低权重token比例
drop_ratio_build = 0.2
# 稀疏向量查询时丢弃低权重token比例
drop_ratio_search = 0.2
# IVF_FLAT索引聚类簇数
ivf_nlist = 128
# IVF查询探测数
nprobe = 10

# 业务配置
[app]
valid_sources = ["management"]
customer_service_phone = ***********
# 新用户默认赠送使用次数
default_quota = 50
# JWT密钥（生产环境请更换为复杂随机字符串）
jwt_secret_key = ***********
# JWT过期时间（小时）
jwt_expire_hours = 24

# 设备配置
[device]
device = cpu
# device = cuda
