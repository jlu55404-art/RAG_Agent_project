<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduRAG管理学(河南)在线问答系统 - 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h1 {
            font-size: 1.6em;
            color: #1a1a2e;
            margin-bottom: 8px;
        }
        .login-header p {
            color: #666;
            font-size: 0.95em;
        }
        .tab-bar {
            display: flex;
            border-bottom: 2px solid #eee;
            margin-bottom: 25px;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            color: #999;
            font-weight: 500;
            transition: all 0.3s;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }
        .tab.active {
            color: #ff8c00;
            border-bottom-color: #ff8c00;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-size: 0.9em;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #ff8c00;
            box-shadow: 0 0 0 3px rgba(255,140,0,0.1);
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1.05em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-primary {
            background: #ff8c00;
            color: white;
        }
        .btn-primary:hover {
            background: #e07b00;
            transform: translateY(-1px);
        }
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .msg {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 0.9em;
            display: none;
        }
        .msg.success { background: #d4edda; color: #155724; display: block; }
        .msg.error { background: #f8d7da; color: #721c24; display: block; }
        .invite-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .invite-section h3 {
            font-size: 0.95em;
            color: #666;
            margin-bottom: 10px;
        }
        .invite-row {
            display: flex;
            gap: 10px;
        }
        .invite-row input {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 0.9em;
        }
        .invite-row input:focus {
            outline: none;
            border-color: #ff8c00;
        }
        .invite-row button {
            padding: 10px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
        }
        .invite-row button:hover { background: #218838; }
        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85em;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>EduRAG管理学</h1>
            <p>河南专升本考生智能问答系统</p>
        </div>

        <div class="tab-bar">
            <div class="tab active" id="tab-login" onclick="switchTab('login')">登录</div>
            <div class="tab" id="tab-register" onclick="switchTab('register')">注册</div>
        </div>

        <!-- 登录表单 -->
        <div id="form-login">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="login-username" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="login-password" placeholder="请输入密码" onkeypress="if(event.key==='Enter')doLogin()">
            </div>
            <button class="btn btn-primary" id="btn-login" onclick="doLogin()">登 录</button>
            <div class="msg" id="login-msg"></div>
        </div>

        <!-- 注册表单 -->
        <div id="form-register" style="display:none">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="reg-username" placeholder="请输入用户名（3-20位）">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="reg-password" placeholder="请输入密码（6位以上）">
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" id="reg-password2" placeholder="再次输入密码" onkeypress="if(event.key==='Enter')doRegister()">
            </div>
            <button class="btn btn-primary" id="btn-register" onclick="doRegister()">注 册</button>
            <div class="msg" id="reg-msg"></div>
        </div>

        <!-- 邀请码兑换 -->
        <div class="invite-section">
            <h3>有邀请码？兑换使用额度</h3>
            <div class="invite-row">
                <input type="text" id="invite-code" placeholder="请输入邀请码">
                <button onclick="doRedeem()">兑换</button>
            </div>
            <div class="msg" id="invite-msg"></div>
        </div>

        <div class="footer-link">EduRAG &copy; 2026 河南专升本管理学在线问答</div>
    </div>

    <script>
        // 检查是否已登录
        if (localStorage.getItem('token')) {
            window.location.href = '/static/index.html';
        }

        function switchTab(tab) {
            document.getElementById('tab-login').classList.toggle('active', tab === 'login');
            document.getElementById('tab-register').classList.toggle('active', tab === 'register');
            document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
        }

        function showMsg(id, text, type) {
            const el = document.getElementById(id);
            el.textContent = text;
            el.className = 'msg ' + type;
            if (type === 'success') setTimeout(() => { el.className = 'msg'; }, 3000);
        }

        async function doLogin() {
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();
            if (!username || !password) { showMsg('login-msg', '请输入用户名和密码', 'error'); return; }

            const btn = document.getElementById('btn-login');
            btn.disabled = true; btn.textContent = '登录中...';
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.code === 0) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', username);
                    showMsg('login-msg', '登录成功，正在跳转...', 'success');
                    setTimeout(() => { window.location.href = '/static/index.html'; }, 800);
                } else {
                    showMsg('login-msg', data.msg || '登录失败', 'error');
                }
            } catch (e) {
                showMsg('login-msg', '网络错误，请稍后重试', 'error');
            }
            btn.disabled = false; btn.textContent = '登 录';
        }

        async function doRegister() {
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value.trim();
            const password2 = document.getElementById('reg-password2').value.trim();
            if (!username || !password) { showMsg('reg-msg', '请填写完整信息', 'error'); return; }
            if (username.length < 3 || username.length > 20) { showMsg('reg-msg', '用户名需3-20位', 'error'); return; }
            if (password.length < 6) { showMsg('reg-msg', '密码至少6位', 'error'); return; }
            if (password !== password2) { showMsg('reg-msg', '两次密码不一致', 'error'); return; }

            const btn = document.getElementById('btn-register');
            btn.disabled = true; btn.textContent = '注册中...';
            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.code === 0) {
                    showMsg('reg-msg', '注册成功，请登录', 'success');
                    setTimeout(() => switchTab('login'), 1500);
                } else {
                    showMsg('reg-msg', data.msg || '注册失败', 'error');
                }
            } catch (e) {
                showMsg('reg-msg', '网络错误，请稍后重试', 'error');
            }
            btn.disabled = false; btn.textContent = '注 册';
        }

        async function doRedeem() {
            const code = document.getElementById('invite-code').value.trim();
            if (!code) { showMsg('invite-msg', '请输入邀请码', 'error'); return; }
            const token = localStorage.getItem('token');
            if (!token) { showMsg('invite-msg', '请先登录后再兑换', 'error'); return; }

            try {
                const res = await fetch('/api/auth/redeem', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ code })
                });
                const data = await res.json();
                showMsg('invite-msg', data.msg, data.code === 0 ? 'success' : 'error');
                if (data.code === 0) document.getElementById('invite-code').value = '';
            } catch (e) {
                showMsg('invite-msg', '网络错误', 'error');
            }
        }
    </script>
</body>
</html>
